    <script>
      (function() {
        try {
          var saved = localStorage.getItem('skl-theme');
          var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
